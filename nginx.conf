worker_processes auto;

pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /ping {
      default_type text/plain;
      return 200 'pong';
    }

    location /api/extract {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://url-sidecar:__MDE_SIDECAR_INTERNAL_PORT__/extract;
    }

    # Persistence sidecar (node:sqlite). Trailing slash strips the /api/db prefix,
    # so /api/db/state → db-sidecar:<port>/state.
    location /api/db {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://db-sidecar:__MDE_DB_SIDECAR_INTERNAL_PORT__/;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
