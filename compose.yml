services:
  frontend-prod:
    build:
      context: .
      target: runtime
    depends_on:
      url-sidecar:
        condition: service_healthy
      db-sidecar:
        condition: service_healthy
    environment:
      MDE_SIDECAR_INTERNAL_PORT: ${MDE_SIDECAR_INTERNAL_PORT}
      MDE_DB_SIDECAR_INTERNAL_PORT: ${MDE_DB_SIDECAR_INTERNAL_PORT}
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${MDE_APP_PORT}:8080"
    restart: unless-stopped

  url-sidecar:
    build:
      context: ./sidecar
    environment:
      MDE_SIDECAR_INTERNAL_PORT: ${MDE_SIDECAR_INTERNAL_PORT}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          port = os.environ.get("MDE_SIDECAR_INTERNAL_PORT", "5280")
          urllib.request.urlopen(f"http://127.0.0.1:{port}/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${MDE_URL_SIDECAR_PORT}:${MDE_SIDECAR_INTERNAL_PORT}"
    restart: unless-stopped

  db-sidecar:
    build:
      context: ./db-sidecar
    environment:
      MDE_DB_SIDECAR_INTERNAL_PORT: ${MDE_DB_SIDECAR_INTERNAL_PORT}
      MDE_DB_PATH: /data/${MDE_DB_FILENAME}
      MDE_DB_BACKUP_DIR: /data/${MDE_DB_BACKUP_SUBDIR}
      MDE_DB_BACKUP_MAX: ${MDE_DB_BACKUP_MAX}
      MDE_DB_BACKUP_INTERVAL_MS: ${MDE_DB_BACKUP_INTERVAL_MS}
    # The DIRECTORY is bound, not the .db file. This keeps the SQLite rollback
    # journal and the backup snapshots on the host next to the database, where a
    # container recreate cannot destroy them and `down -v` cannot reach them.
    # db-sidecar is defined ONLY here, and both compose merges include this file,
    # so prod and dev structurally cannot diverge onto different databases.
    #
    # `target` is a literal, deliberately. Only the HOST side is configuration;
    # the container path is an internal invariant. Sourcing an env var of "/data"
    # through MSYS bash (Git Bash on Windows) rewrites it to "C:/Program Files/Git/data"
    # on the way to the Windows docker binary, and the mount fails.
    volumes:
      - type: bind
        source: ${MDE_DB_DIR}
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require('node:http')
          const port = process.env.MDE_DB_SIDECAR_INTERNAL_PORT || '15280'
          http.get('http://127.0.0.1:' + port + '/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "127.0.0.1:${MDE_DB_SIDECAR_PORT}:${MDE_DB_SIDECAR_INTERNAL_PORT}"
    restart: unless-stopped
