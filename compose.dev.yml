services:
  frontend-dev:
    build:
      context: .
      target: dev
    # Vite directly, NOT `pnpm dev`. The `dev` script front-runs
    # scripts/adagio-dev.mjs, a host-only supervisor that refuses to start unless
    # hostname === adagio and that brings the db-sidecar up itself. Inside the
    # container the hostname is the container id, so it exits 1 and the service
    # crash-loops; the sidecar it would have started is already guaranteed by
    # depends_on below.
    command: pnpm exec vite --host 0.0.0.0 --port ${MDE_DEV_PORT}
    depends_on:
      url-sidecar:
        condition: service_healthy
      db-sidecar:
        condition: service_healthy
    environment:
      MDE_APP_PORT: ${MDE_APP_PORT}
      MDE_DEV_PORT: ${MDE_DEV_PORT}
      MDE_EXTRACT_PROXY_ORIGIN: http://url-sidecar:${MDE_SIDECAR_INTERNAL_PORT}
      MDE_DB_PROXY_ORIGIN: http://db-sidecar:${MDE_DB_SIDECAR_INTERNAL_PORT}
      MDE_DB_SIDECAR_PORT: ${MDE_DB_SIDECAR_PORT}
      MDE_DB_SIDECAR_INTERNAL_PORT: ${MDE_DB_SIDECAR_INTERNAL_PORT}
      MDE_HOST: ${MDE_HOST}
      MDE_URL_SIDECAR_PORT: ${MDE_URL_SIDECAR_PORT}
      MDE_DEV_HTTPS: ${MDE_DEV_HTTPS}
      # Container-side cert paths. MDE_DEV_TLS_CERT_PATH/_KEY_PATH in .env are
      # host-shaped Windows paths for `pnpm dev` on the host; in here the same
      # cert directory is bind-mounted read-only at /certs.
      MDE_DEV_TLS_CERT_PATH: /certs/${MDE_DEV_TLS_CERT_FILE}
      MDE_DEV_TLS_KEY_PATH: /certs/${MDE_DEV_TLS_KEY_FILE}
      VITE_MDE_APP_ORIGIN: ${VITE_MDE_APP_ORIGIN}
      VITE_MDE_EXTRACT_PATH: ${VITE_MDE_EXTRACT_PATH}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const https = require('node:https')
          const port = process.env.MDE_DEV_PORT || '5250'
          const req = https.get({
            hostname: '127.0.0.1',
            port,
            path: '/ping',
            rejectUnauthorized: false,
          }, res => {
            res.resume()
            if (res.statusCode < 200 || res.statusCode >= 300) process.exit(1)
          })
          req.on('error', () => process.exit(1))
          req.setTimeout(5000, () => {
            req.destroy()
            process.exit(1)
          })
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${MDE_DEV_PORT}:${MDE_DEV_PORT}"
    restart: unless-stopped
    # Literal target — see the note on db-sidecar's bind in compose.yml.
    volumes:
      - type: bind
        source: ${MDE_DEV_TLS_DIR}
        target: /certs
        read_only: true
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: sync+restart
          path: ./vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./Dockerfile
