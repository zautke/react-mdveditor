services:
  frontend-dev:
    build:
      context: .
      target: dev
    command: pnpm dev --host 0.0.0.0 --port ${MDE_DEV_PORT}
    depends_on:
      url-sidecar:
        condition: service_healthy
    environment:
      MDE_APP_PORT: ${MDE_APP_PORT}
      MDE_DEV_PORT: ${MDE_DEV_PORT}
      MDE_EXTRACT_PROXY_ORIGIN: http://url-sidecar:${MDE_SIDECAR_INTERNAL_PORT}
      MDE_HOST: ${MDE_HOST}
      MDE_URL_SIDECAR_PORT: ${MDE_URL_SIDECAR_PORT}
      MDE_DEV_HTTPS: ${MDE_DEV_HTTPS}
      MDE_DEV_TLS_CERT_PATH: ${MDE_DEV_TLS_CERT_PATH}
      MDE_DEV_TLS_KEY_PATH: ${MDE_DEV_TLS_KEY_PATH}
      VITE_MDE_APP_ORIGIN: ${VITE_MDE_APP_ORIGIN}
      VITE_MDE_EXTRACT_PATH: ${VITE_MDE_EXTRACT_PATH}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const https = require('node:https')
          const port = process.env.MDE_DEV_PORT || '5250'
          const req = https.get({
            hostname: '127.0.0.1',
            port,
            path: '/ping',
            rejectUnauthorized: false,
          }, res => {
            res.resume()
            if (res.statusCode < 200 || res.statusCode >= 300) process.exit(1)
          })
          req.on('error', () => process.exit(1))
          req.setTimeout(5000, () => {
            req.destroy()
            process.exit(1)
          })
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${MDE_DEV_PORT}:${MDE_DEV_PORT}"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: sync+restart
          path: ./vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./Dockerfile
