        - text: "<!--URL_META:{\"sourceUrl\":\"https://iamafoodblog.com/authentic-instant-pot-pho-recipe\",\"title\":\"Truly Authentic Vietnamese Pho Recipe · i am a food blog\",\"author\":\"April 8\",\"date\":\"2026-04-08\",\"siteName\":\"I Am A Food Blog\",\"images\":[\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w.jpg\"]}--> <article><div><header><h1>Easy Authentic Instant Pot Pho (stovetop too)</h1><p class=\"lede\">Just really authentic pho.</p><p class=\"byline\">April 8, 2026 by Mike</p><figure><img src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w.jpg\" alt=\"pho | www.iamafoodblog.com\" height=\"1668\" width=\"2500\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w.jpg 2500w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-600x400.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-1024x683.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-1536x1025.jpg 1536w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-2048x1366.jpg 2048w\" sizes=\"(max-width: 2500px) 100vw, 2500px\"></figure></header><section aria-label=\"Article\"><p><strong>Pho is maybe the world’s most beloved soup.</strong></p> <p>My earliest memories of going out to eat were to pho restaurants. As a Vietnamese person, pho is something I’ve been making for over 20 years and eaten for my whole life. There are other pho recipes on the internet, but a lot of them don’t taste quite right to me, so this one is mine, and I hope you enjoy it too.</p> <p>If you want to fill up on some deep pho love and geekery, read on, or if you would like to just make the best, most authentic pho you’ve ever made at home, feel free to jump to the recipe using these handy links:</p> <ol> <li><a href=\"#what-is-pho\">What is pho?</a></li> <li><a href=\"#pho-soup\">Pho soup</a></li> <li><a href=\"#pho-noodles\">Pho noodles</a></li> <li><a href=\"#meats\">Meats</a></li> <li><a href=\"#toppings\">Toppings &amp; garnishes</a></li> <li><a href=\"#bowls\">Bowls</a></li> <li><a href=\"#how-to-make-pho\">How to make pho</a></li> <li><a href=\"#how-to-pronounce-pho\">How to pronounce pho</a></li> <li><a href=\"#pho-variations\">Pho variations</a></li> <li><a href=\"#wprm-recipe-container-33982\">Just skip to the recipe</a></li> </ol> <h2 id=\"what-is-pho\">What is pho?</h2> <p>Pho (properly made) is a deeply spiced and aromatic soup of a clear broth and rice noodles, topped with different cuts and textures of meats and fresh herbs. It doesn’t need to be meat, and in fact many Vietnamese have vegan pho, but it’s by default beef noodle soup, which is what this recipe is for.</p> <p><img alt=\"authentic pho | www.iamafoodblog.com\" width=\"1450\" height=\"906\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1960-2.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1960-2.jpg 1450w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1960-2-600x375.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1960-2-1024x640.jpg 1024w\" sizes=\"(max-width: 1450px) 100vw, 1450px\"></p> <h2 id=\"pho-soup\">Pho soup</h2> <p>A great pho soup is a well made beef broth with charred aromatics, sweetened with sugar, and seasoned with fish sauce. The signature taste of beef pho though comes from the charred aromatics and spices: if you leave those out, you don’t have pho, you have generic beef noodle soup.</p> <h3>Bones vs Meat</h3> <p>Traditionally pho soup was made with bones, but I prefer a cheap cut of meat. Where we live, bones cost more or less the same as cheap beef because of the popularity of bone broth and marrow. Lately we’ve gravitated towards a cut from the ribs called finger meat (shown below) which I feel has the perfect ratio of connective tissue, fat, and meat to make an incredible pho soup. Using a cut of meat with some connective tissue and fat goes a long way, but any cheap cut of meat, soup bones, or a mix of both will do. I’m a sucker for whatever is on sale. You won’t be throwing away the meat once the pho is made either, so there’s no wastage if you go the meat route.</p> <p><img alt=\"Ingredients for the best pho soup | www.iamafoodblog.com\" width=\"1450\" height=\"968\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2.jpg 1450w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2-1024x684.jpg 1024w\" sizes=\"(max-width: 1450px) 100vw, 1450px\"></p> <h3>Charred Spices &amp; Aromatics</h3> <p><strong>Charred aromatics are the most important part of a great pho soup.</strong> It’s the first thing I learned from my parents when we made pho at home, especially charring the onion. My dad says it’s not even pho if you don’t do that.</p> <p>The easiest way to char your aromatics is by putting them on a sheet tray and blow torching them all at once. While everyone needs <a href=\"http://amzn.to/2zzzTKz\" target=\"_blank\" rel=\"noopener noreferrer\">a good blow torch</a> because they’re cheap and insanely useful in the kitchen, you can also char over a gas range, on an outdoor grill, in the oven/broiler, or in a cast iron pan. If you’re charring over a gas range or even with a blowtorch, just char the larger items: ginger, onions/shallots, cinnamon stick, and star anise.</p> <p>You’ll see daikon in the recipe list as well. That’s my mom’s secret ingredient (it’s a lot of people’s secret ingredient). You don’t need to/can’t toast that.</p> <p><img alt=\"Charring spices for pho | www.iamafoodblog.com\" width=\"1450\" height=\"968\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3.jpg 1450w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3-1024x684.jpg 1024w\" sizes=\"(max-width: 1450px) 100vw, 1450px\"></p> <h3>Fat content</h3> <p><strong>Every good noodle soup needs fat for the broth to stick to the noodle and pho is no exception.</strong> If you prefer to control the fat content of your pho (and can wait a few hours before eating) this is a trick I learned from <a href=\"http://amzn.to/2zzNEcn\" target=\"_blank\" rel=\"noopener noreferrer\">Ivan Ramen</a>‘s cookbook:</p> <ol> <li>Leave the pho in the fridge until the fat solidifies (typically 4-6 hours)</li> <li>Scoop only the fat out into a small saucepan.</li> <li>Melt it over low heat.</li> <li>Strain into a small container.</li> </ol> <p>The fat will keep in the fridge for up to a week, and you can measure out exactly how much each bowl will have. Add at least a teaspoon to each bowl of pho you make; unless you’re crazy about living fat free, your tastebuds will thank you for it. For us though, we just go with whatever fat comes with the soup.</p> <p><img alt=\"Pho soup | www.iamafoodblog.com\" width=\"1450\" height=\"968\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1933-2.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1933-2.jpg 1450w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1933-2-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1933-2-1024x684.jpg 1024w\" sizes=\"(max-width: 1450px) 100vw, 1450px\"></p> <h2>Seasoning</h2> <p><strong>Pho is about balance, but not necessarily subtlety.</strong> Personally speaking, I like my pho to be <em>extra</em>. I’ll season my pho soup until it’s just on the verge of too sweet, then I add enough fish sauce to counter balance the sweetness and create a massive umami bomb. The blandness of the noodles and the brightness of the customary squeeze of lime at the table will temper all the craziness and bring the universe back into balance.</p> <p>The sugar I prefer for pho is rock sugar, which you should be able to get in the Asian aisle of just about any supermarket, and definitely at every Asian supermarket. Some people traditionally use palm sugar. I wouldn’t say it’s totally worth the extra effort to get special sugar, but if you’re in the area already, rock sugar is delicious and very pretty. Regular white sugar is just fine though.</p> <p><strong>On Richness:</strong> some commenters complain that this pho doesn’t have the richness they’re looking for. That richness comes from MSG, which is an essential and authentic, though not traditional ingredient in many bowls of pho around the world. If you think this needs richness, reach for that little red panda shaped bottle. I add about 1 tbsp but in 1 tsp increments.</p> <p><img alt=\"Rock sugar for pho | www.iamafoodblog.com\" width=\"1450\" height=\"968\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1881-2.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1881-2.jpg 1450w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1881-2-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1881-2-1024x684.jpg 1024w\" sizes=\"(max-width: 1450px) 100vw, 1450px\"></p> <h3>Fish sauce</h3> <p>Not all fish sauces are equal, and you really do get what you pay for, especially when you never pay more than $10 or so. If you aren’t shopping at an Asian grocery store, <a href=\"http://amzn.to/2zB0mY0\" target=\"_blank\" rel=\"noopener noreferrer\">Red Boat</a> is usually your best bet. If you’re at the Asian supermarket though, and see something called <strong>mắm nhĩ</strong>, go for that: it’s basically the equivalent of first press or extra virgin for fish sauce, and is always a good bet. <strong>Never buy mắm nêm unless you are prepared to cook outdoors.</strong></p> <p><strong>Do you even need fish sauce?</strong> No. It’s traditional, but it’s also traditional to use salt or a mix of both depending on how “clean” you want your pho to taste. My mom leaves out the fish sauce in favor of salt these days. I would never consider this. She says I’ll change my mind in 30 years.</p> <h2 id=\"pho-noodles\">Pho noodles</h2> <p>If you can, get fresh pho noodles, but if you can’t, the dried stuff works too. Sometimes the noodles will be called rice stick or Thai rice stick noodles. Medium thickness is best. Briefly blanch the noodles about halfway to your desired softness, then drain and rinse in cold water so they don’t stick too much. Allow them to dry out in a colander for 5-10 minutes while you prepare the other items.</p> <p>Drying out the rice noodles seems counterintuitive since you just cooked them, but it’s the secret to flavorful noodles as they suck in the pho broth to rehydrate later.</p> <p><img alt=\"pho noodles | www.iamafoodblog.com\" width=\"1450\" height=\"1812\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1982.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1982.jpg 1450w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1982-480x600.jpg 480w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1982-819x1024.jpg 819w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1982-1229x1536.jpg 1229w\" sizes=\"(max-width: 1450px) 100vw, 1450px\"></p> <h2 id=\"meats\">Meats</h2> <p>Pho is beloved not just for its broth but the meaty toppings. Sirloin, well done brisket, flank, tripe, meatballs, the list goes on and on. Anyone who has been eating pho for awhile will tell you that dặc biệt (house special), which is every meat the restaurant has, is the way to go, but at home, you may not want to go that nuts.</p> <p>For me though, a good pho should have 2-3 different meats. If you make this with finger meat, flank, or brisket, you should have some nice well done meat, and to that I’d recommend some meatballs, sirloin that’s been thinly sliced and allowed to cook in the broth (buy sirloin roast to get the nice round pieces), and, for the truly adventurous, tripe/omasum.</p> <h2>Sirloin</h2> <p><strong>Sirloin is the star of pho.</strong> It’s the default inclusion, it’s always there. You want it as thinly sliced as possible and cooked only in the soup. Traditionally much of it will be left out of the soup both so you can see how fresh and high quality the meat is, and so that the meat doesn’t overcook before it hits your table. It only needs about 30 seconds to cook in the piping hot broth.</p> <h2>Meatballs</h2> <p><strong>Vietnamese meatballs are bouncier and denser</strong> than what you’d typically think of meatballs as. Their traditional greyish color can be offputting at first, but their deliciousness will quickly retrain your mind to associate them with feelings of fullness and delirious satiety. Because of how dense these are, I like to halve them.</p> <h2>Brisket and Flank</h2> <p><strong>Well done brisket or flank’s soft fall-apart-in-your-mouth texture</strong> is deeply satisfying, but so are the pho-full flavors they pick up in cooking in the pho broth for hours. Properly speaking, they should cook in the pho broth after it’s been made and seasoned, but if you are short on time, just cook them at the same time the pho broth is made. They won’t have as much flavor, but the texture will still be there. And, will you really notice the flavor as you dip it in your personalized mix of sriracha and hoisin anyway?</p> <h2>Tendon</h2> <p><strong>Tendon is chewy, a little crunchy, and so satisfying</strong> in a bowl of otherwise very soft things. It can be extremely hard to find unless you go to a butcher or a Vietnamese supermarket. Not even an Asian supermarket typically carries these, but if you see it, you should get it. Tendon should be chopped into bite sized pieces and added along with the bones as it takes hours to properly soften.</p> <h2>Tripe</h2> <p><strong>Tripe/Omasum is another slightly crunchy textureful meat</strong> that doesn’t look as good as it deserves to. It’s always been my favorite part of pho. You want it thinly sliced and briefly blanched, 1-2 minutes. I blanch it in the noodle water to keep it white, but again, we can one pot this in the instant pot, it’s not that finicky.</p> <p><img alt=\"Pho recipe | www.iamafoodblog.com\" width=\"1450\" height=\"967\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1970.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1970.jpg 1450w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1970-600x400.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1970-1024x683.jpg 1024w\" sizes=\"(max-width: 1450px) 100vw, 1450px\"></p> <h2 id=\"toppings\">Toppings &amp; Garnishes</h2> <p>Vietnamese food’s claim to fame are the fresh flavors and herbs and pho is no different:</p> <ul> <li><strong>Sliced raw onions and chopped cilantro</strong> are basically mandatory in my pho. I realize both are separately polarizing to two different groups of people. They’re pretty important to me though.</li> <li><strong>Thai basil is a must</strong>, but if you can’t get any, sweet basil is a sad-but-passable substitute.</li> <li><strong>Limes add brightness</strong> and offset the salty-sweet-umami-bomb in your mouth.</li> <li><strong>Vietnamese food is spicy,</strong> but pho isn’t, some say that’s because it originated in the less-spicy north. Regardless, Jalapeños or Thai chilies are always supplied to fix that issue for the people who love spice.</li> <li><strong>Bean sprouts add an earthiness</strong> and sometimes crunch to your soup. Many people like to blanch their sprouts and judge a pho place based on whether they took the time to blanch the sprouts first. Other pho restaurants ask you if you want them blanched or not. For me, I don’t like them at all and skip them.</li> <li><strong>Sriracha and hoisin sauce</strong> has been a fixture at pho restaurants since forever, even in Vietnam. Always feel welcome to add them to your soup and especially to make a dip out of them for your meats. They are 100% authentic, despite what <a href=\"https://twitter.com/bonappetit/status/773185266202898432\" target=\"_blank\" rel=\"noopener noreferrer\">Bon Appétit</a> said about that (I still can’t believe they didn’t delete the tweet).</li> </ul> <p><img alt=\"toppings for pho | www.iamafoodblog.com\" width=\"1450\" height=\"968\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1961.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1961.jpg 1450w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1961-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1961-1024x684.jpg 1024w\" sizes=\"(max-width: 1450px) 100vw, 1450px\"></p> <h2 id=\"bowls\">Bowls</h2> <p>Over the years, I’ve come to realize that unless you grew up eating noodle soups, you probably don’t have the right bowl for pho at home. Serving pho in mixing bowls is pretty sad after you’ve slaved away for hours on a beautiful pho broth. You need large bowls that can comfortably fit 2 cups of soup as well as noodles and meats, my rule is about 9″ wide and 3.5″ high. You should also warm your bowls before serving. We just fill them up with hot tap water for 3-4 minutes.</p> <h2 id=\"how-to-make-pho\">How to make pho</h2> <p>Do you really need hours to make pho? Traditionally this is the way it was done at large restaurants, but Vietnamese people embraced the pressure cooker basically the moment it became available, so there is zero shame to making a one hour Instant Pot pho. Bonus, it traps the smells, aka flavor, inside the soup instead of in your house. If you don’t own an Instant Pot though, making it the traditional stovetop way or even the crockpot way is easy.</p> <h3>How to make pho in an Instant Pot</h3> <ul> <li><strong>Char your spices and aromatics.</strong> Ideally with a blowtorch so you can char all the spices at once, but if you have a grill, broiler, or cast iron pan, just char the onion/shallots, ginger, and cinnamon.</li> <li><strong>Load everything up in the instant pot along with 4 quarts of water.</strong> If you want to do this the easy one pot super fast way, just throw it all in. If you have a little more time, leave out the sugar and topping meats to braise slowly later.</li> <li><strong>Cook.</strong> Cook the broth on high pressure for 35 minutes. Do a quick release once done. If you intend to eat right away, prepare the rice noodles, meats, and garnishes while the broth is cooking.</li> <li><strong>Season.</strong> Add sugar (if you didn’t add it in the prior steps) and fish sauce (or salt) until the broth is just about overseasoned. It’ll balance out once you add the noodles.</li> <li><strong>Build.</strong> Add rice noodles and sirloin in your bowl, then fill the bowl up with about 2 cups (or more) of pho soup. Top with onion and cilantro, then at the table, let everyone add thai basil, bean sprouts, chilies, hoisin, and sriracha to their liking.</li> <li><strong>Enjoy!</strong></li> </ul> <p><img alt=\"pho soup | www.iamafoodblog.com\" width=\"1450\" height=\"968\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921.jpg 1450w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921-1024x684.jpg 1024w\" sizes=\"(max-width: 1450px) 100vw, 1450px\"></p> <h3>How to make pho on the stove</h3> <ul> <li><strong>Char your spices and aromatics.</strong> Ideally with a blowtorch so you can char all the spices at once, but if you have a grill, broiler, or cast iron pan, just char the onion/shallots, ginger, and cinnamon.</li> <li><strong>Boil</strong> the bones and meats for 5 minutes to remove most of the scum, then drain. Ideally, wash the pot again too.</li> <li><strong>Fill </strong>up the pot with the parboiled bones or finger meat, tendons if using, aromatics, and spices along with enough water to cover. Bring to a very gentle simmer and hold it there for 4-6 hours. If you have flank or brisket, add it in 2 hours before the broth is finished cooking.</li> <li><strong>Prepare. </strong>Just before you intend to eat, prepare the rice noodles, meats, and garnishes while the broth is cooking.</li> <li><strong>Season.</strong> Add sugar and fish sauce (or salt) until the broth is just about overseasoned. It’ll balance out once you add the noodles.</li> <li><strong>Build.</strong> Add rice noodles and sirloin in your bowl, then fill the bowl up with about 2 cups (or more) of pho soup. Top with onion and cilantro, then at the table, let everyone add thai basil, bean sprouts, chilies, hoisin, and sriracha to their liking.</li> <li><strong>Enjoy!</strong></li> </ul> <h2 id=\"how-to-pronounce-pho\">How to pronounce pho</h2> <p>By now everyone knows to pronounce pho as fuh. But you can be a little closer to the tonal Vietnamese if you pronouce it as if you are asking a question. I think it’s closest if you always pronounce the single word as it sounds at the end of this sentence: “Really?! You want to eat pho?!”</p> <h2 id=\"pho-variations\">Other phos to make</h2> <ul> <li><a href=\"https://iamafoodblog.com/authentic-instant-pot-chicken-pho-recipe/\">Authentic Instant Pot Chicken Pho Recipe</a></li> <li><a href=\"https://iamafoodblog.com/best-instant-pot-vegan-pho-recipe/\">The Best Instant Pot Vegan Pho Recipe</a></li> <li><a href=\"https://iamafoodblog.com/turkey-pho-recipe/\">Turkey Pho Recipe</a></li> <li><a href=\"https://iamafoodblog.com/pho-strami-a-pho-forward-take-on-pastrami/\">Pho-strami: A Pho-Forward Take on Pastrami</a></li> </ul> <div id=\"recipe\"></div><div id=\"wprm-recipe-container-33982\"><div><div> <div><img alt=\"pho | www.iamafoodblog.com\" width=\"150\" height=\"150\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-150x150.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-150x150.jpg 150w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-500x500.jpg 500w\" sizes=\"(max-width: 150px) 100vw, 150px\"></div> <a href=\"https://iamafoodblog.com/wprm_print/authentic-pho-recipe\" target=\"_blank\" rel=\"nofollow\" aria-label=\"Print Recipe\"><span></span> </a> <a href=\"https://www.pinterest.com/pin/create/bookmarklet/?url=https%3A%2F%2Fiamafoodblog.com%2Fauthentic-instant-pot-pho-recipe%2F&amp;media=https%3A%2F%2Fiamafoodblog.com%2Fwp-content%2Fuploads%2F2017%2F11%2Fauthentic-instant-pot-pho-recipe-1959w.jpg&amp;description=A+pho+recipe+developed+over+decades+from+our+Vietnamese+family+to+yours.&amp;is_video=false\" target=\"_blank\" rel=\"nofollow noopener\" role=\"button\" aria-label=\"Pin Recipe\"><span></span> </a> <h2>Authentic Pho Recipe</h2> <div><span>A pho recipe developed over decades from our Vietnamese family to yours.</span></div> <div><span>Serves </span><span aria-label=\"Adjust recipe servings\">6</span></div> <div id=\"wprm-recipe-user-rating-0\"><span role=\"button\" tabindex=\"0\" aria-label=\"Rate this recipe 1 out of 5 stars\" onfocus=\"window.WPRecipeMaker.userRating.enter(this)\" onblur=\"window.WPRecipeMaker.userRating.leave(this)\" onkeypress=\"window.WPRecipeMaker.userRating.click(this, event)\"></span><span role=\"button\" tabindex=\"0\" aria-label=\"Rate this recipe 2 out of 5 stars\" onfocus=\"window.WPRecipeMaker.userRating.enter(this)\" onblur=\"window.WPRecipeMaker.userRating.leave(this)\" onkeypress=\"window.WPRecipeMaker.userRating.click(this, event)\"></span><span role=\"button\" tabindex=\"0\" aria-label=\"Rate this recipe 3 out of 5 stars\" onfocus=\"window.WPRecipeMaker.userRating.enter(this)\" onblur=\"window.WPRecipeMaker.userRating.leave(this)\" onkeypress=\"window.WPRecipeMaker.userRating.click(this, event)\"></span><span role=\"button\" tabindex=\"0\" aria-label=\"Rate this recipe 4 out of 5 stars\" onfocus=\"window.WPRecipeMaker.userRating.enter(this)\" onblur=\"window.WPRecipeMaker.userRating.leave(this)\" onkeypress=\"window.WPRecipeMaker.userRating.click(this, event)\"></span><span role=\"button\" tabindex=\"0\" aria-label=\"Rate this recipe 5 out of 5 stars\" onfocus=\"window.WPRecipeMaker.userRating.enter(this)\" onblur=\"window.WPRecipeMaker.userRating.leave(this)\" onkeypress=\"window.WPRecipeMaker.userRating.click(this, event)\"></span><div><span>4.84</span> from <span>53</span> votes</div></div> <div><div><span>Prep Time </span><span><span>5<span> minutes</span></span> <span aria-hidden=\"true\">mins</span></span></div><div><span>Cook Time </span><span><span>55<span> minutes</span></span> <span aria-hidden=\"true\">mins</span></span></div><div><span>Total Time </span><span><span>1<span> hour</span></span> <span aria-hidden=\"true\">hr</span></span></div></div> </div> <div id=\"recipe-33982-ingredients\"><h3>Ingredients</h3><div><h4>Pho spices and aromatics</h4><ul><li><span>5</span> <span>star anise pods</span></li><li><span>1</span> <span>cinnamon stick</span></li><li><span>1</span> <span>tsp</span> <span>whole cloves</span></li><li><span>1</span> <span>tsp</span> <span>coriander seeds</span></li><li><span>1</span> <span>tsp</span> <span>peppercorns</span> <span>white preferred, black if not</span></li><li><span>1</span> <span>tsp</span> <span>fennel</span> <span>optional</span></li><li><span>5</span> <span>cardamom pods</span> <span>optional</span></li><li><span>1/2</span> <span>medium onion</span> <span><strong>peeled</strong></span></li><li><span>2</span> <span>inches</span> <span>ginger</span> <span><strong>halved lengthwise</strong></span></li><li><span>1</span> <span>shallot</span> <span><strong>peeled and halved</strong></span></li></ul></div><div><h4>For the pho soup</h4><ul><li><span>2</span> <span>lbs</span> <span>beef for soup</span> <span>see notes</span></li><li><span>3</span> <span>inch</span> <span>daikon</span> <span><strong>1\" slices</strong>, optional</span></li><li><span>4</span> <span>qt</span> <span>water</span></li><li><span>2</span> <span>oz</span> <span>rock sugar</span> <span>~1/4 cup white sugar, or to taste</span></li><li><span>1/4</span> <span>cup</span> <span><a href=\"https://amzn.to/2O60uUS\">fish sauce</a></span> <span>or to taste</span></li><li><span>24</span> <span>oz</span> <span>dried pho noodles</span> <span>or fresh, see notes</span></li><li><span>8</span> <span>Vietnamese meatballs</span> <span>or more, <strong>cut in halves</strong></span></li><li><span>1</span> <span>lb</span> <span>sirloin roast</span> <span><strong>thinly sliced</strong></span></li><li><span>1</span> <span>lb</span> <span>brisket</span> <span>or flank steak</span></li><li><span>1/2</span> <span>lb</span> <span>tendon</span> <span>optional</span></li><li><span>1/2</span> <span>lb</span> <span>omasum</span> <span>optional</span></li></ul></div><div><h4>To serve the pho</h4><ul><li><span>1/2</span> <span>cup</span> <span>fresh cilantro</span> <span><strong>roughly chopped</strong></span></li><li><span>1/2</span> <span>medium onion</span> <span><strong>sliced</strong></span></li><li><span>3</span> <span>cups</span> <span>bean sprouts</span> <span>blanched if desired</span></li><li><span>1</span> <span>lime</span> <span><strong>cut</strong> into wedges</span></li><li><span>1</span> <span>bunch</span> <span>Thai basil</span></li><li><span>1</span> <span>jalapeño</span> <span>sliced</span></li><li><span>sriracha</span></li><li><span>hoisin sauce</span></li></ul></div></div> <div id=\"recipe-33982-equipment\"><h3>Special Equipment</h3><ul><li><div><a href=\"https://amzn.to/3k73E8O\">instant pot</a></div></li></ul></div> <div><button aria-label=\"Show instruction media\"><span></span><span></span></button><button aria-label=\"Hide instruction media\"><span></span><span></span></button></div> <div id=\"recipe-33982-instructions\"><h3>Instructions</h3><div><ul><li id=\"wprm-recipe-33982-step-0-0\"><div><span>Arrange the larger aromatics on a heat proof baking sheet and blow torch until fragrant. Alternately, toast all aromatics in a cast iron pan on the stove or in the oven broiler for a few minutes until fragrant.</span></div><div><img alt=\"Charring spices for pho | www.iamafoodblog.com\" width=\"600\" height=\"401\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3-600x401.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3-1024x684.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3.jpg 1450w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li></ul></div><div><h4>To make the pho soup</h4><ul><li id=\"wprm-recipe-33982-step-1-0\"><div><span>Transfer charred aromatics along with sugar and all meats except the sirloin to Instant Pot/Pressure cooker. Fill to the max fill line with water, about 4 quarts. Set pressure to high and cook time to 35 minutes and cook. Quick release the pressure when cooking time is completed. See notes for stovetop instructions.</span></div><div><img alt=\"Ingredients for the best pho soup | www.iamafoodblog.com\" width=\"600\" height=\"401\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2-600x401.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2-1024x684.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2.jpg 1450w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li><li id=\"wprm-recipe-33982-step-1-1\"><div><span>Once cool enough to taste, add fish sauce 1 tablespoon at a time until it’s just about overseasoned. Add extra sugar if needed. If you go too far, just add water. You may optionally strain the pho at this point to get as clear of a broth as possible. </span></div><div><img alt=\"pho soup | www.iamafoodblog.com\" width=\"600\" height=\"401\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921-600x401.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921-1024x684.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921.jpg 1450w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li></ul></div><div><h4>To serve</h4><ul><li id=\"wprm-recipe-33982-step-2-0\"><div><span>Warm your bowls with hot tap water, then drain. Bring a pot of water to a boil and briefly blanch the noodles, then rinse with cold water and drain well. Divide noodles evenly into each of the warmed bowls. Thinly slice the sirloin (if needed) and top each bowl. Thickly chop all the other meats and divide evenly.</span></div><div><img alt=\"ingredients for pho | www.iamafoodblog.com\" width=\"600\" height=\"401\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1941-600x401.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1941-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1941-1024x684.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1941.jpg 1450w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li><li id=\"wprm-recipe-33982-step-2-1\"><div><span>Cover with about 2 cups of hot broth per bowl and sprinkle chopped cilantro and sliced onions over top. Serve with a plate of bean sprouts, limes, Thai basil, and chilies. Have small dipping plates of sriracha and hoisin sauces for each person.</span></div><div><img alt=\"pho | www.iamafoodblog.com\" width=\"600\" height=\"400\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-600x400.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-600x400.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-1024x683.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-1536x1025.jpg 1536w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-2048x1366.jpg 2048w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li></ul></div></div> <div id=\"recipe-video\"></div> <div id=\"recipe-33982-notes\"><h3>Notes</h3><div><span><span>We used finger meat in this recipe but the choice of beef or bones is up to you. See the section on meats for more details.</span></span><div></div> <span><span>If you don’t have a pressure cooker, bring the beef to a boil along with enough water to cover for 5 mins, then drain and wash the pot. Add clean cold water and gently simmer the beef, tendons if using, aromatics, and daikon for 4-6 hours. You can do this part in a crockpot as well. Try to maintain the same level of water during the cooking process, checking back every 30 minutes or so. 2 hours before the soup is finished, add the brisket. 20 minutes before serving, add meatballs and tripe. </span></span><div></div> <span><strong>While the nutrition information is as accurate as possible, it is only representative if you consume all of the broth. </strong>It includes 1/2 of meat per bowl, which may be a lot more than you have if you didn't go for the optional meats, and includes 1 tbsp of fat per bowl. If you go with 1 tsp of fat, it is 806 calories, and if you go with no fat, it is 773 calories per bowl.</span></div></div> <div id=\"recipe-33982-nutrition\"><h4>Estimated Nutrition</h4><div><div> <div>Nutrition Facts</div> <div>Authentic Pho Recipe</div> <div></div> <div> Amount Per Serving </div> <div> <span><strong>Calories</strong> 888</span> <span>Calories from Fat 247</span> </div> <div></div> <div> <span><strong>% Daily Value*</strong></span> </div> <div><span><strong>Fat</strong> 27.4g</span><span><strong>42%</strong></span></div><div><span>Saturated Fat 12g</span><span><strong>75%</strong></span></div><div><span><strong>Cholesterol</strong> 217mg</span><span><strong>72%</strong></span></div><div><span><strong>Sodium</strong> 1854mg</span><span><strong>81%</strong></span></div><div><span><strong>Potassium</strong> 965mg</span><span><strong>28%</strong></span></div><div><span><strong>Carbohydrates</strong> 76.7g</span><span><strong>26%</strong></span></div><div><span>Fiber 1g</span><span><strong>4%</strong></span></div><div><span>Sugar 15.1g</span><span><strong>17%</strong></span></div><div><span><strong>Protein</strong> 80.7g</span><span><strong>161%</strong></span></div> <div>* Percent Daily Values are based on a 2000 calorie diet.</div> </div> </div></div> </div></div> <div><img src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-pinterest.jpg\" alt=\"Authentic Instant Pot Pho Recipe - www.iamafoodblog.com\" width=\"600\" height=\"1959\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-pinterest.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-pinterest-184x600.jpg 184w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-pinterest-314x1024.jpg 314w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </section><section aria-label=\"Recipe\"><h2>Authentic Pho Recipe</h2> <div><span>A pho recipe developed over decades from our Vietnamese family to yours.</span></div> <div id=\"recipe-33982-ingredients\"><h3>Ingredients</h3><div><h4>Pho spices and aromatics</h4><ul><li><span>5</span> <span>star anise pods</span></li><li><span>1</span> <span>cinnamon stick</span></li><li><span>1</span> <span>tsp</span> <span>whole cloves</span></li><li><span>1</span> <span>tsp</span> <span>coriander seeds</span></li><li><span>1</span> <span>tsp</span> <span>peppercorns</span> <span>white preferred, black if not</span></li><li><span>1</span> <span>tsp</span> <span>fennel</span> <span>optional</span></li><li><span>5</span> <span>cardamom pods</span> <span>optional</span></li><li><span>1/2</span> <span>medium onion</span> <span><strong>peeled</strong></span></li><li><span>2</span> <span>inches</span> <span>ginger</span> <span><strong>halved lengthwise</strong></span></li><li><span>1</span> <span>shallot</span> <span><strong>peeled and halved</strong></span></li></ul></div><div><h4>For the pho soup</h4><ul><li><span>2</span> <span>lbs</span> <span>beef for soup</span> <span>see notes</span></li><li><span>3</span> <span>inch</span> <span>daikon</span> <span><strong>1\" slices</strong>, optional</span></li><li><span>4</span> <span>qt</span> <span>water</span></li><li><span>2</span> <span>oz</span> <span>rock sugar</span> <span>~1/4 cup white sugar, or to taste</span></li><li><span>1/4</span> <span>cup</span> <span><a href=\"https://amzn.to/2O60uUS\">fish sauce</a></span> <span>or to taste</span></li><li><span>24</span> <span>oz</span> <span>dried pho noodles</span> <span>or fresh, see notes</span></li><li><span>8</span> <span>Vietnamese meatballs</span> <span>or more, <strong>cut in halves</strong></span></li><li><span>1</span> <span>lb</span> <span>sirloin roast</span> <span><strong>thinly sliced</strong></span></li><li><span>1</span> <span>lb</span> <span>brisket</span> <span>or flank steak</span></li><li><span>1/2</span> <span>lb</span> <span>tendon</span> <span>optional</span></li><li><span>1/2</span> <span>lb</span> <span>omasum</span> <span>optional</span></li></ul></div><div><h4>To serve the pho</h4><ul><li><span>1/2</span> <span>cup</span> <span>fresh cilantro</span> <span><strong>roughly chopped</strong></span></li><li><span>1/2</span> <span>medium onion</span> <span><strong>sliced</strong></span></li><li><span>3</span> <span>cups</span> <span>bean sprouts</span> <span>blanched if desired</span></li><li><span>1</span> <span>lime</span> <span><strong>cut</strong> into wedges</span></li><li><span>1</span> <span>bunch</span> <span>Thai basil</span></li><li><span>1</span> <span>jalapeño</span> <span>sliced</span></li><li><span>sriracha</span></li><li><span>hoisin sauce</span></li></ul></div></div> <div id=\"recipe-33982-equipment\"><h3>Special Equipment</h3><ul><li><div><a href=\"https://amzn.to/3k73E8O\">instant pot</a></div></li></ul></div> <div id=\"recipe-33982-instructions\"><h3>Instructions</h3><div><ul><li id=\"wprm-recipe-33982-step-0-0\"><div><span>Arrange the larger aromatics on a heat proof baking sheet and blow torch until fragrant. Alternately, toast all aromatics in a cast iron pan on the stove or in the oven broiler for a few minutes until fragrant.</span></div><div><img alt=\"Charring spices for pho | www.iamafoodblog.com\" width=\"600\" height=\"401\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3-600x401.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3-1024x684.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1903-3.jpg 1450w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li></ul></div><div><h4>To make the pho soup</h4><ul><li id=\"wprm-recipe-33982-step-1-0\"><div><span>Transfer charred aromatics along with sugar and all meats except the sirloin to Instant Pot/Pressure cooker. Fill to the max fill line with water, about 4 quarts. Set pressure to high and cook time to 35 minutes and cook. Quick release the pressure when cooking time is completed. See notes for stovetop instructions.</span></div><div><img alt=\"Ingredients for the best pho soup | www.iamafoodblog.com\" width=\"600\" height=\"401\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2-600x401.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2-1024x684.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1914-2.jpg 1450w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li><li id=\"wprm-recipe-33982-step-1-1\"><div><span>Once cool enough to taste, add fish sauce 1 tablespoon at a time until it’s just about overseasoned. Add extra sugar if needed. If you go too far, just add water. You may optionally strain the pho at this point to get as clear of a broth as possible. </span></div><div><img alt=\"pho soup | www.iamafoodblog.com\" width=\"600\" height=\"401\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921-600x401.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921-1024x684.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/pho_1921.jpg 1450w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li></ul></div><div><h4>To serve</h4><ul><li id=\"wprm-recipe-33982-step-2-0\"><div><span>Warm your bowls with hot tap water, then drain. Bring a pot of water to a boil and briefly blanch the noodles, then rinse with cold water and drain well. Divide noodles evenly into each of the warmed bowls. Thinly slice the sirloin (if needed) and top each bowl. Thickly chop all the other meats and divide evenly.</span></div><div><img alt=\"ingredients for pho | www.iamafoodblog.com\" width=\"600\" height=\"401\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1941-600x401.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1941-600x401.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1941-1024x684.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1941.jpg 1450w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li><li id=\"wprm-recipe-33982-step-2-1\"><div><span>Cover with about 2 cups of hot broth per bowl and sprinkle chopped cilantro and sliced onions over top. Serve with a plate of bean sprouts, limes, Thai basil, and chilies. Have small dipping plates of sriracha and hoisin sauces for each person.</span></div><div><img alt=\"pho | www.iamafoodblog.com\" width=\"600\" height=\"400\" src=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-600x400.jpg\" srcset=\"https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-600x400.jpg 600w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-1024x683.jpg 1024w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-1536x1025.jpg 1536w, https://iamafoodblog.b-cdn.net/wp-content/uploads/2017/11/authentic-instant-pot-pho-recipe-1959w-2048x1366.jpg 2048w\" sizes=\"(max-width: 600px) 100vw, 600px\"></div> </li></ul></div></div> <div id=\"recipe-33982-notes\"><h3>Notes</h3><div><span><span>We used finger meat in this recipe but the choice of beef or bones is up to you. See the section on meats for more details.</span></span><div></div> <span><span>If you don’t have a pressure cooker, bring the beef to a boil along with enough water to cover for 5 mins, then drain and wash the pot. Add clean cold water and gently simmer the beef, tendons if using, aromatics, and daikon for 4-6 hours. You can do this part in a crockpot as well. Try to maintain the same level of water during the cooking process, checking back every 30 minutes or so. 2 hours before the soup is finished, add the brisket. 20 minutes before serving, add meatballs and tripe. </span></span><div></div> <span><strong>While the nutrition information is as accurate as possible, it is only representative if you consume all of the broth. </strong>It includes 1/2 of meat per bowl, which may be a lot more than you have if you didn't go for the optional meats, and includes 1 tbsp of fat per bowl. If you go with 1 tsp of fat, it is 806 calories, and if you go with no fat, it is 773 calories per bowl.</span></div></div> </section></div></article>"
